
name: Build NyxiumOre

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler NyxiumOre
        run: gradle build

      - name: Récupérer le JAR
        uses: actions/upload-artifact@v4
        with:
          name: NyxiumOre-JAR
          path: build/libs/*.jar
